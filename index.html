<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triad Fury">
<meta name="theme-color" content="#0d0a11">

<title>Triad Fury</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* One dark arena world, by choice. Layout: stacked menu column up to 1000px; fight is a fixed 16:9 stage. */
:root{
  color-scheme:dark;
  --bg:#0d0a11; --panel:#18131f; --panel2:#221a2b; --line:#34283d;
  --text:#f4ecdf; --muted:#a79bb0; --gold:#f6b93b; --blood:#e5383b; --jade:#3ddbc4;
  --disp:"Anton",Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:500 15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:.04em;margin:0;text-wrap:balance;text-transform:uppercase}
[hidden]{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h2{font-size:26px;flex:1;min-width:0}
.gold{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700;font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#f6b93b 55%,#a86a0c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18);vertical-align:-3px;flex:none}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:700;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.gold-b{background:var(--gold);color:#201400;border-color:#ffd77a}
.btn.red{background:var(--blood);border-color:#ff7a7c;color:#fff}
.btn.big{font-family:var(--disp);font-weight:400;font-size:24px;letter-spacing:.08em;padding:12px 30px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
/* home */
.hero{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.hero img{display:block;width:100%;height:auto}
.logo{position:absolute;left:0;top:0;padding:clamp(12px,3vw,26px)}
.logo h1{font-size:clamp(40px,9vw,84px);line-height:.92;font-style:italic;text-shadow:0 4px 0 #000,0 0 30px rgba(0,0,0,.8)}
.logo h1 span{color:var(--blood);display:block}
.logo p{margin:8px 0 0;font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:12px;text-shadow:0 2px 4px #000}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ac,var(--gold));border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.mode:hover{background:var(--panel2)}
.mode b{font-family:var(--disp);font-weight:400;font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.mode span{color:var(--muted);font-size:14px}
.how{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.how h3{font-size:18px;margin-bottom:6px}
.how ul{margin:0;padding-left:18px;color:var(--muted);max-width:68ch}
.how li b{color:var(--text)}
.foot{display:flex;gap:10px;flex-wrap:wrap}
.btn.cont{flex:1;min-width:220px;font-size:22px;padding:12px 18px}
@media (max-height:520px) and (orientation:landscape){.wrap{gap:10px;padding-top:8px}.hero img{max-height:30vh;object-fit:cover;object-position:right center}.logo{padding:10px 14px}.logo h1{font-size:34px}.logo h1 span{display:inline;margin-left:.2em}.logo p{display:none}.modes{grid-template-columns:repeat(3,1fr);gap:8px}.mode{padding:8px 12px}.mode b{font-size:18px}.mode span{font-size:12px;line-height:1.25}.btn.cont{font-size:19px;padding:8px 14px}}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.fcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 0 10px;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;text-align:left}
.fcard:hover{border-color:var(--ac)}
.fcard img{width:100%;aspect-ratio:22/26;object-fit:cover;display:block;border-bottom:3px solid var(--ac)}
.fcard .fn{font-family:var(--disp);font-size:18px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px 0;line-height:1.1}
.fcard .ft{color:var(--muted);font-size:13px;padding:0 10px}
.fcard .lv{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.72);border-radius:6px;padding:2px 8px;font-weight:700;font-size:13px;display:flex;gap:5px;align-items:center}
.fcard.locked img{filter:grayscale(1) brightness(.5)}
.fcard.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.fcard .ord{position:absolute;top:8px;left:8px;background:var(--gold);color:#201400;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-weight:700}
.grid.sm .fn{font-size:14px}.grid.sm .ft{display:none}
.maxed{color:var(--jade)}
/* detail */
.detail{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px}
@media(max-width:700px){.detail{grid-template-columns:1fr}.detail .dl img{max-width:240px}}
.dl{display:flex;flex-direction:column;gap:10px}
.dl img{width:100%;border-radius:12px;border:1px solid var(--line);border-bottom:4px solid var(--ac)}
.stats{display:flex;gap:10px}
.stats div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.stats span{color:var(--muted);font-size:12px;letter-spacing:.12em;display:block}
.stats b{font-size:22px;font-variant-numeric:tabular-nums}
.dr{display:flex;flex-direction:column;gap:14px;min-width:0}
.dr h1{font-size:40px;line-height:1}
.sub{margin:0;color:var(--ac);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:17px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec p{margin:0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{display:flex;gap:3px;flex:1;min-width:120px}
.bar i{height:10px;flex:1;background:var(--panel2);border-radius:2px;border:1px solid var(--line)}
.bar i.f{background:var(--ac);border-color:var(--ac)}
.mv{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.mv:first-of-type{border-top:0;padding-top:0}
.mv>div{flex:1;min-width:200px}
.mv b{font-size:16px}
.pw{display:inline-flex;gap:3px;margin-left:8px;vertical-align:1px}
.pw i{width:14px;height:6px;background:var(--gold);border-radius:1px;transform:skewX(-20deg)}
.rk{font-size:13px;color:var(--text);margin-top:2px;font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--panel2);border:1px dashed var(--line);border-radius:8px;padding:10px;min-height:76px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left}
.slot.full{border-style:solid;border-color:var(--rc,var(--line))}
.slot.sel{box-shadow:0 0 0 2px var(--gold)}
.slot small{color:var(--muted);font-size:12px;line-height:1.25}
.sym{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--rc);color:#120c08;font-weight:700;flex:none}
.pick{display:flex;flex-direction:column;gap:6px}
.pick .btn{justify-content:flex-start;text-align:left;font-weight:500}
.pick .btn small{color:var(--muted)}
.rcard{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--rc);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rcard h3{font-size:17px;display:flex;gap:8px;align-items:center}
.rcard p{margin:0;color:var(--muted);flex:1;font-size:14px}
.rcard .own{font-size:13px;color:var(--muted);margin-top:auto}
.rcard p{flex:none}
.rcard .bar{flex:none}
.rcard h3 img.sh{width:30px;height:30px;border-radius:50%;border:2px solid var(--rc);flex:none}
.grid.shop{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
/* tower */
.stages{display:flex;flex-direction:column;gap:8px}
.stage{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:left;flex-wrap:wrap}
.stage .n{font-family:var(--disp);font-size:26px;width:44px;text-align:center}
.stage .info{flex:1;min-width:140px}
.stage .info b{display:block}
.stage .info span{color:var(--muted);font-size:13px}
.heads{display:flex;gap:4px}
.heads img{width:40px;height:40px;border-radius:50%;border:2px solid var(--line)}
.stage.next{border-color:var(--gold)}
.stage.boss{border-left:5px solid var(--blood)}
.stage.lockd{opacity:.45}
.stage .rw{font-weight:700;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.tag2{font-size:11px;font-weight:700;letter-spacing:.1em;border-radius:4px;padding:1px 6px;background:var(--panel2);border:1px solid var(--line)}
.tag2.ok{color:var(--jade);border-color:var(--jade)}
.tag2.bs{color:#fff;background:var(--blood);border-color:var(--blood)}
/* prep */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.vs h3{font-size:15px;color:var(--muted);margin-bottom:6px}
.vs .mid{font-family:var(--disp);font-size:34px;color:var(--blood);font-style:italic}
.vs .heads img{width:clamp(44px,11vw,72px);height:clamp(44px,11vw,72px)}
.vs .side:last-child{text-align:right}.vs .side:last-child .heads{justify-content:flex-end}
.empty{width:clamp(44px,11vw,72px);height:clamp(44px,11vw,72px);border-radius:50%;border:2px dashed var(--line);display:inline-block}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.arena-b{padding:0;overflow:hidden;flex-direction:column;gap:0;width:150px}
.arena-b img{width:100%;display:block}
.arena-b span{padding:5px 8px}
.note{color:var(--muted);margin:0}
/* fight */
#fight{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#000;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#stage{position:relative;aspect-ratio:16/9;font-size:16px;flex:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.cb{position:absolute;border-radius:50%;border:.18em solid rgba(255,255,255,.55);background:rgba(14,10,20,.62);color:#fff;font-family:var(--disp);letter-spacing:.06em;display:grid;place-items:center;touch-action:none;padding:0;line-height:1}
.cb:active,.cb.dn{transform:scale(.94);background:rgba(255,255,255,.22)}
#bBlock{left:2em;bottom:1.6em;width:7.6em;height:7.6em}
#bBlock span{font-size:1.5em}
#bPause{left:50%;top:.8em;transform:translateX(-50%);width:2.6em;height:2.6em;border-width:.12em}
#bPause span{font-size:1em}
#sps{position:absolute;right:1.6em;bottom:1.6em;display:flex;gap:.9em;align-items:flex-end}
.sp{position:relative;width:6.3em;height:6.3em;opacity:.5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em}
.sp b{font-weight:400;font-size:.86em;max-width:5.4em;text-align:center;white-space:normal;line-height:1.05}
.sp .pw i{width:.9em;height:.4em}.sp .pw{margin:0}
.sp.on{opacity:1;border-color:var(--gold);box-shadow:0 0 1.2em rgba(246,185,59,.55)}
.sp.u{width:7.2em;height:7.2em}
.sp.u.on{border-color:#ff5d5d;box-shadow:0 0 1.6em rgba(255,70,70,.7)}
#tags{position:absolute;left:1.4em;bottom:10.4em;display:flex;gap:.7em}
.tg{position:relative;width:4.6em;height:4.6em;overflow:hidden;border-width:.14em}
.tg img{width:100%;height:100%;border-radius:50%;display:block}
.tg .hp{position:absolute;left:10%;right:10%;bottom:6%;height:.42em;background:#000;border-radius:.2em;overflow:hidden}
.tg .hp i{display:block;height:100%;background:#4ade80}
.tg.dead{opacity:.3;filter:grayscale(1)}
.tg .cd{position:absolute;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;font-size:1.5em}
#finpad{position:absolute;inset:0;touch-action:none;cursor:pointer}
#stage.fin #sps,#stage.fin #bBlock,#stage.fin #tags{opacity:.12;transition:opacity .25s}

#rot{position:absolute;inset:0;z-index:9;background:#0d0a11;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
#rot b{font-family:var(--disp);font-weight:400;font-size:28px;letter-spacing:.05em;text-transform:uppercase}#rot span{color:var(--muted)}
#rot .ri{font-size:72px;line-height:1;animation:rotq 2.2s ease-in-out infinite}@keyframes rotq{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (prefers-reduced-motion:reduce){#rot .ri{animation:none}}
#ov{position:absolute;inset:0;background:rgba(6,4,10,.8);display:flex;align-items:center;justify-content:center;padding:1em}
.res{background:var(--panel);border:1px solid var(--line);border-radius:.8em;padding:1.4em 2em;text-align:center;max-width:34em;display:flex;flex-direction:column;gap:.7em;align-items:center}
.res h1{font-size:3.4em;font-style:italic;line-height:1}
.res.win h1{color:var(--gold)}.res.lose h1{color:var(--blood)}
.res p{margin:0;color:var(--muted)}
.rew{font-size:1.7em;font-weight:700;display:flex;gap:.4em;align-items:center;flex-wrap:wrap;justify-content:center}
.rew small{font-size:.5em;color:var(--muted);width:100%}
.res .row{justify-content:center}
.res .btn{font-size:1em}
.fst{display:flex;flex-wrap:wrap;gap:.4em;justify-content:center}
.fst span{background:var(--panel2);border:1px solid var(--line);border-radius:.4em;padding:.3em .7em;font-size:.8em;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:5.5em}
.fst b{color:var(--text);font-size:1.25em}
.fst .ff{border-color:var(--blood)}.fst .ff b{color:var(--blood)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.fcard,.mode,.sec,.rcard,.stage,.how,.vs{border:2px solid #000;box-shadow:4px 4px 0 #000}
.fcard.on{box-shadow:0 0 0 3px var(--gold),4px 4px 0 #000}
.stage.next{border-color:var(--gold)}
.rcard{border-top:5px solid var(--rc)}
.rcard.lockd{opacity:.62}
.nx{color:var(--jade)!important;font-size:13px}
.vsm{font-family:var(--disp);color:var(--blood);font-style:italic}
.scene{border-radius:14px;border:3px solid #000;box-shadow:6px 6px 0 #000;background-size:cover;background-position:center;padding:18px;min-height:440px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.scene h2{font-size:24px;font-style:italic;text-shadow:0 3px 0 #000}
.panel{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.panel img{width:min(36vw,210px);border:3px solid #000;border-bottom:6px solid;border-radius:6px;box-shadow:5px 5px 0 #000;transform:rotate(-2deg)}
.bubble,.caption{color:#15101a;border:3px solid #000;padding:12px 18px;box-shadow:5px 5px 0 #000;font-size:18px;font-weight:600;flex:1;min-width:220px;max-width:60ch}
.bubble{background:#fffdf5;border-radius:22px 22px 22px 4px}
.bubble b{font-family:var(--disp);font-weight:400;letter-spacing:.06em;text-transform:uppercase;font-size:19px;display:block}
.bubble p,.caption p{margin:0}
@media (max-height:520px){.scene{min-height:0;padding:10px 14px;gap:8px}.scene h2{font-size:18px}.panel{flex-wrap:nowrap;gap:12px}.panel img{width:auto;height:min(46vh,190px)}.bubble,.caption{font-size:15px;padding:8px 12px;min-width:0}.bubble b{font-size:15px}}
.caption{background:#ffe45c;font-style:italic}
.pgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
@media(max-width:560px){.pgrid{grid-template-columns:repeat(5,1fr)}}
.pc{aspect-ratio:1;background:var(--panel);border:2px solid var(--line);border-radius:8px;font-family:var(--disp);font-size:18px;display:grid;place-items:center;position:relative;padding:0;overflow:hidden}
.pc.done{background:#17332d;border-color:var(--jade);color:var(--jade)}
.pc.next{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.pc.boss{border-color:var(--blood)}
.pc.boss img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
.pc.boss span{position:relative;color:#fff;text-shadow:0 2px 0 #000,0 0 8px #000}
.pc:disabled{opacity:.4;cursor:not-allowed}
.got{display:flex;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--rc);border-radius:10px;padding:8px 12px;text-align:left}
.got img{width:44px;height:44px;border-radius:50%;border:2px solid var(--rc)}
.got b{display:block}.got small{color:var(--muted);line-height:1.25;display:block}
.slot b .tag2,.stage .sym{vertical-align:1px}
</style>
</head>
<body>
<div id="menu"></div>
<div id="fight" hidden>
  <div id="rot" hidden><div class="ri">⟳</div><b>Turn your phone sideways</b><span>Fights are played in landscape.</span></div>
  <div id="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <div id="tags"></div>
    <button class="cb" id="bBlock" aria-label="Hold to block"><span>BLOCK</span></button>
    <div id="sps"></div>
    <div id="finpad" hidden></div>
    <button class="cb" id="bPause" aria-label="Pause"><span>II</span></button>
    <div id="ov" hidden></div>
  </div>
</div>
<script>
(()=>{'use strict';
/* ================= helpers ================= */
const W=960,H=540,GY=446,HOME=[350,610],FACE=[1,-1],DIST=260,D2R=Math.PI/180,SC=1.1;
const R=Math.random,rnd=(a,b)=>a+R()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const $=s=>document.querySelector(s);
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH=!!((window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window));
function seed(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=clamp(Math.round((n>>16)*f),0,255),g=clamp(Math.round((n>>8&255)*f),0,255),b=clamp(Math.round((n&255)*f),0,255);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')'}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const DF='Anton,Impact,Haettenschweiler,sans-serif';

/* ================= game data ================= */
const M=(name,cost,style,hits,mult,o)=>Object.assign({name,cost,style,hits,mult},o||{});

function sfx(k,v){if(S.mute||!AC)return;try{
  if(k==='hit'){noise(.12,.5,1400);tone('sine',150,50,.12,.4)}
  else if(k==='tap'){tone('sine',130,60,.08,.18)}
  else if(k==='thump'){tone('sine',110,38,.2,.42);noise(.08,.18,700)}
  else if(k==='heavy'){noise(.22,.7,900);tone('sine',120,35,.25,.6)}
  else if(k==='block'||k==='blockh'){const h=k==='blockh',t=AC.currentTime;
    tone('sine',h?85:100,h?36:48,h?.22:.14,h?.5:.36);
    noise(h?.18:.11,h?.55:.42,h?260:340);
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='bandpass';f.frequency.value=900;f.Q.value=.8;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(h?.1:.07,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+.06)}
  else if(k==='sp'){tone('sawtooth',180,720,.3,.16)}
  else if(k==='ult'){tone('sawtooth',90,900,.6,.2);tone('square',60,45,.6,.14)}
  else if(k==='ko'){tone('sine',320,40,.8,.5);noise(.3,.5,600)}
  else if(k==='ui'){const t=AC.currentTime,d=.22,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='bandpass';f.Q.value=1.1;
    f.frequency.setValueAtTime(350,t);f.frequency.exponentialRampToValueAtTime(1600,t+d*.6);f.frequency.exponentialRampToValueAtTime(900,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.16,t+d*.45);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+.02)}
  else if(k==='coin'){tone('square',990,1320,.09,.08);setTimeout(()=>{try{tone('square',1320,1760,.12,.08)}catch(e){}},80)}
  else if(k==='bad'){tone('square',200,140,.14,.1)}
  else if(k==='tag'){tone('triangle',300,600,.15,.2)}
  else if(k==='parry'){tone('triangle',1900,1300,.2,.2);tone('sine',2800,2650,.35,.1);noise(.06,.35,5000)}
  else if(k==='heavyW'){tone('sawtooth',110,340,.3,.07);noise(.3,.12,900)}
  else if(k==='crush'){noise(.3,.85,1100);tone('sine',90,28,.35,.7);tone('square',180,60,.12,.12)}
  else if(k==='breaker'){noise(.35,.6,2600);tone('square',220,900,.25,.13);tone('sine',140,40,.3,.45)}
  else if(k==='finish'){tone('sawtooth',58,38,1.4,.2);tone('sine',116,50,1.4,.3);noise(.8,.25,300)}
  else if(k==='finstep'){const f=520*Math.pow(1.26,v||0);tone('triangle',f,f*1.02,.16,.18);tone('sine',f*2,f*2,.1,.06)}
  else if(k==='finfail'){tone('square',240,90,.35,.1)}
}catch(e){}}

function finishBattle(){const c=B.cfg,win=B.result==='win',base=win?c.reward:Math.round(c.reward*.15),cb=B.T[0].fs.reduce((n,f)=>n+rv(f,'coin'),0),st=B.st,fb=win&&(st.fin||st.ender)?Math.round(base*.25):0,bonus=Math.round(base*cb/100)+fb;
  let note='You still earn a small purse. Upgrade your fighters and try again.',extra='';
  if(win){
    if(c.mode==='tower'){if(c.stage>S.tower){S.tower=c.stage;note='Stage '+c.stage+' cleared for the first time.'}else note='Stage '+c.stage+' cleared again. Replays pay half.'}
    else if(c.mode==='pin'){if(c.stage>S.pin){S.pin=c.stage;note='Pinnacle level '+c.stage+' conquered.';const pd=pinDef(c.stage);if(pd.relic){S.inv[pd.relic]=(S.inv[pd.relic]||0)+1;extra+=relicGot(pd.relic)}}else note='Level '+c.stage+' cleared again. Replays pay 40%.'}
    else if(c.mode==='story'){const ch=STORY[c.stage-1];if(c.stage>S.story){S.story=c.stage;note='Chapter '+c.stage+' complete.';
        if(ch.char&&!S.chars[ch.char].own){S.chars[ch.char].own=true;extra+='<div class="got" style="--rc:'+CH[ch.char].L.accent+'"><img src="'+IMG[ch.char].head+'" alt=""><div><b>'+CH[ch.char].name+' unlocked</b><small>'+CH[ch.char].title+' joins your roster.</small></div></div>'}
        if(ch.relic){S.inv[ch.relic]=(S.inv[ch.relic]||0)+1;extra+=relicGot(ch.relic)}}else note='Chapter replayed. Replays pay 30%.'}
    else if(c.mode==='tut'){note=S.tut?'Training complete.':'Tutorial complete! You know every move. Time to start the Story.';S.tut=true}
    else note='Quick battle won.'}
  S.gold+=base+bonus;save();sfx('coin');

  const next=win&&((c.mode==='tower'&&c.stage<STAGES)||(c.mode==='pin'&&c.stage<PINMAX)),story=c.mode==='story'&&win;
  elOv.innerHTML='<div class="res '+(win?'win':'lose')+'"><h1>'+(win?'Victory':'Defeated')+'</h1><p>'+note+'</p>'+
    '<div class="rew"><i class="coin"></i><span>+'+(base+bonus).toLocaleString()+' gold</span>'+(bonus?'<small>Includes '+[fb?'+'+fb+(st.ender?' Signature Ender bonus':' Fury Finish bonus'):'',bonus-fb?'+'+(bonus-fb)+' from Lucky Coin':''].filter(Boolean).join(' and ')+'</small>':'')+'</div>'+
    '<div class="fst">'+[['Best combo',st.max+(st.max===1?' hit':' hits')],['Heavies',st.heavy],['Guard breaks',st.guard],['Perfect blocks',st.perfect],['Breakers',st.breakers]].map(x=>'<span><b>'+x[1]+'</b>'+x[0]+'</span>').join('')+(st.fin?'<span class="ff"><b>✓</b>Fury Finish</span>':'')+(st.ender?'<span class="ff"><b>✪</b>'+st.ender+'</span>':'')+'</div>'+extra+
    '<div class="row">'+(tutR?'<button class="btn gold-b" data-a="tutStory">Play Story</button><button class="btn" data-a="again">Train again</button><button class="btn" data-a="exit">Leave</button>':'')+(tutR?'':(story?'<button class="btn gold-b" data-a="exit">Continue</button>':'')+(next?'<button class="btn gold-b" data-a="nextStage">Next '+(c.mode==='pin'?'level':'stage')+'</button>':'')+'<button class="btn'+(next||story?'':' gold-b')+'" data-a="again">'+(win?'Fight again':'Retry')+'</button><button class="btn" data-a="toRoster">Upgrade fighters</button>'+(story?'':'<button class="btn" data-a="exit">Leave</button>'))+'</div></div>';
  elOv.hidden=false}

scene(){const sc=UI.scene,ln=sc.lines[sc.i],c=ln[0]&&CH[ln[0]],last=sc.i===sc.lines.length-1;
  return'<div class="scene" style="background-image:linear-gradient(rgba(10,6,14,.35),rgba(10,6,14,.88)),url('+thumb(sc.arena)+')"><h2>'+sc.title+'</h2><div class="panel">'+(c?'<img src="'+IMG[ln[0]].full+'" alt="" style="border-bottom-color:'+c.L.accent+'">':'')+'<div class="'+(c?'bubble':'caption')+'">'+(c?'<b>'+c.name+'</b>':'')+'<p>'+ln[1]+'</p></div></div><div class="row"><button class="btn gold-b" data-a="sceneNext">'+(last?'Continue':'Next')+'</button>'+(last?'':'<button class="btn ghost" data-a="sceneSkip">Skip</button>')+'<span class="note">'+(sc.i+1)+' / '+sc.lines.length+'</span></div></div>'},
prep(){const p=UI.prep,team=S.team.filter(id=>S.chars[id].own);S.team=team;let en,lvl,title;
  if(p.mode==='tower'){const d=stageDef(p.stage);en=d.enemies.map(e=>e.cid);lvl=d.lvl;title='Stage '+p.stage+': '+ARENAS[d.arena].name}
  else if(p.mode==='pin'){const d=pinDef(p.stage);en=d.enemies.map(e=>e.cid);lvl=d.lvl;title='Pinnacle '+p.stage+(d.boss?': '+CH[en[2]].name:': '+ARENAS[d.arena].name)}
  else{en=p.enemies;lvl=quickLvl();title='Quick Battle'}
  let h=header(title,modeDest(p.mode))+'<div class="vs"><div class="side"><h3>Your team</h3><div class="heads">'+[0,1,2].map(i=>team[i]?'<img src="'+IMG[team[i]].head+'" alt="'+CH[team[i]].name+'" style="border-color:'+CH[team[i]].L.accent+'">':'<span class="empty"></span>').join('')+'</div></div><div class="mid">VS</div><div class="side"><h3>Enemy · level '+lvl+'</h3>'+heads(en)+'</div></div>';
  if(p.mode==='pin'){const d=pinDef(p.stage);if(d.relic)h+='<div class="got" style="--rc:'+RL[d.relic].col+'"><span class="sym">'+RL[d.relic].sym+'</span><div><b>'+(p.stage>S.pin?'Boss reward: ':'Already earned: ')+RL[d.relic].name+'</b><small>'+rdesc(d.relic,1)+'</small></div></div>'}
  if(p.mode==='quick')h+='<div class="opts">'+ARENAS.map((a,i)=>'<button class="btn arena-b'+(p.arena===i?' sel':'')+'" data-a="arena" data-i="'+i+'"><img src="'+thumb(i)+'" alt=""><span>'+a.name+'</span></button>').join('')+'</div><div class="opts">'+['Easy','Normal','Hard'].map((n,i)=>'<button class="btn'+(p.diff===i?' sel':'')+'" data-a="diff" data-i="'+i+'">'+n+'</button>').join('')+'<button class="btn ghost" data-a="reroll">New opponents</button></div>';
  h+='<div class="row"><button class="btn big red" data-a="fight"'+(team.length===3?'':' disabled')+'>Fight</button><span class="note">'+(team.length===3?'The first fighter you pick leads.':'Pick '+(3-team.length)+' more fighter'+(3-team.length>1?'s':'')+'.')+'</span></div>'+
  '<div class="grid sm">'+CHARS.filter(c=>S.chars[c.id].own).map(c=>{const i=team.indexOf(c.id);return fcard(c,{act:'pick',on:i>=0,ord:i>=0?i+1:0})}).join('')+'</div>';
  return h}
};
function quickLvl(){const t=S.team.filter(id=>S.chars[id].own),avg=t.length?Math.round(t.reduce((n,id)=>n+S.chars[id].lvl,0)/t.length):1;return Math.max(1,avg+[-1,0,2][UI.prep.diff])}
function rollEnemies(){const p=CHARS.map(c=>c.id).filter(id=>!S.team.includes(id));for(let i=p.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[p[i],p[j]]=[p[j],p[i]]}return p.slice(0,3)}
function draw(){elMenu.innerHTML='<div class="wrap">'+V[UI.screen]()+'</div>'}
function go(s){UI.screen=s;UI.slot=null;if(s!=='home')UI.resetArm=false;draw();window.scrollTo(0,0)}
function playScene(title,lines,arena,done){UI.scene={title,lines,arena,i:0,done};go('scene')}
const ownDef=id=>{const s=S.chars[id];return{cid:id,lvl:s.lvl,ranks:s.ranks.slice(),relics:relMap(id)}};
function buildCfg(){const p=UI.prep;
  if(p.mode==='tut')return{mode:'tut',team:['kaida','brakk','sylphine'].map(cid=>({cid,lvl:3,ranks:[1,1,1],relics:{}})),enemies:[{cid:'torque',lvl:1,ranks:[1,1,1],relics:{}}],arena:1,ai:0,hpMul:2.5,reward:S.tut?60:400,label:'TRAINING'};
  if(p.mode==='tower'){const d=stageDef(p.stage);return{mode:'tower',stage:p.stage,team:S.team.slice(0,3).map(ownDef),enemies:d.enemies,arena:d.arena,ai:d.ai,hpMul:d.hpMul,reward:p.stage>S.tower?d.reward:Math.round(d.reward*.5),label:'TOWER · STAGE '+p.stage+(d.boss?' · BOSS':'')}}
  if(p.mode==='pin'){const d=pinDef(p.stage);return{mode:'pin',stage:p.stage,team:S.team.slice(0,3).map(ownDef),enemies:d.enemies,arena:d.arena,ai:d.ai,hpMul:d.hpMul,reward:p.stage>S.pin?d.reward:Math.round(d.reward*.4),label:'PINNACLE · LEVEL '+p.stage+(d.boss?' · BOSS':'')}}
  if(p.mode==='story'){const ch=STORY[p.stage-1],rk=Math.min(5,1+Math.floor(ch.lvl/4)),full=300+120*p.stage;
    return{mode:'story',stage:p.stage,team:ch.team.map(id=>{const s=S.chars[id];return s.own?{cid:id,lvl:Math.max(ch.lvl+1,s.lvl),ranks:s.ranks.map(r=>Math.max(r,rk)),relics:relMap(id)}:{cid:id,lvl:ch.lvl+1,ranks:[rk,rk,rk],relics:{}}}),
      enemies:ch.foes.map(id=>({cid:id,lvl:ch.lvl,ranks:[rk,rk,rk],relics:{}})),arena:ch.arena,ai:Math.min(.8,.12+p.stage*.05),hpMul:p.stage===1?.75:.9,reward:p.stage>S.story?full:Math.round(full*.3),label:'CHAPTER '+p.stage+' · '+ch.t.toUpperCase()}}
  const lvl=quickLvl(),t=S.team,ar=Math.round(t.reduce((n,id)=>n+S.chars[id].ranks.reduce((a,b)=>a+b,0)/3,0)/t.length),rk=clamp(ar+[-1,0,1][p.diff],1,5);
  return{mode:'quick',team:t.slice(0,3).map(ownDef),enemies:p.enemies.map(cid=>({cid,lvl,ranks:[rk,rk,rk],relics:{}})),arena:p.arena,ai:[.2,.5,.85][p.diff],hpMul:[.85,1,1.1][p.diff],reward:Math.round((70+45*lvl)*[.8,1,1.4][p.diff]),label:'QUICK BATTLE · '+['EASY','NORMAL','HARD'][p.diff]}}
const ACT={
  go:d=>{sfx('ui');go(d.s)},
  tut:()=>{sfx('ui');UI.prep={mode:'tut'};showFight(buildCfg())},
  tutStory:()=>{leaveFight();ACT.chapter({s:S.story<STORY.length?S.story+1:1})},
  quick:()=>{sfx('ui');UI.prep={mode:'quick',arena:Math.floor(R()*3),diff:1,enemies:rollEnemies()};go('prep')},
  stage:d=>{sfx('ui');UI.prep={mode:d.m||'tower',stage:+d.s};go('prep')},
  chapter:d=>{sfx('ui');const n=+d.s,ch=STORY[n-1];UI.prep={mode:'story',stage:n};playScene('Chapter '+n+': '+ch.t,ch.intro,ch.arena,()=>showFight(buildCfg()))},
  sceneNext:()=>{sfx('ui');const sc=UI.scene;if(sc.i<sc.lines.length-1){sc.i++;draw()}else sc.done()},
  sceneSkip:()=>{sfx('ui');UI.scene.done()},
  char:d=>{sfx('ui');UI.cid=d.id;go('char')},
  pick:d=>{const i=S.team.indexOf(d.id);if(i>=0)S.team.splice(i,1);else if(S.team.length<3)S.team.push(d.id);else{sfx('bad');return}sfx('ui');save();draw()},
  arena:d=>{UI.prep.arena=+d.i;sfx('ui');draw()},diff:d=>{UI.prep.diff=+d.i;sfx('ui');draw()},reroll:()=>{UI.prep.enemies=rollEnemies();sfx('ui');draw()},
  fight:()=>{if(S.team.length!==3)return;sfx('ui');showFight(buildCfg())},
  unlock:()=>{const c=CH[UI.cid];if(S.gold<c.cost)return;S.gold-=c.cost;S.chars[c.id].own=true;save();sfx('coin');draw()},
  lvl:()=>{const st=S.chars[UI.cid],c=lvlCost(st.lvl);if(st.lvl>=MAXL||S.gold<c)return;S.gold-=c;st.lvl++;save();sfx('coin');draw()},
  rank:d=>{const st=S.chars[UI.cid],i=+d.i,c=rankCost(st.ranks[i]);if(st.ranks[i]>=MAXR||S.gold<c)return;S.gold-=c;st.ranks[i]++;save();sfx('coin');draw()},
  slot:d=>{UI.slot=UI.slot===+d.i?null:+d.i;sfx('ui');draw()},
  equip:d=>{const st=S.chars[UI.cid];if(UI.slot==null||avail(d.id)<=0||st.relics.includes(d.id))return;st.relics[UI.slot]=d.id;UI.slot=null;save();sfx('ui');draw()},
  unequip:()=>{const st=S.chars[UI.cid];if(UI.slot==null)return;st.relics[UI.slot]=null;UI.slot=null;save();sfx('ui');draw()},
  buy:d=>{const r=RL[d.id];if(r.pin||r.story||S.gold<r.cost)return;if(r.sig&&(!S.chars[r.sig].own||(S.inv[r.id]||0)>0))return;S.gold-=r.cost;S.inv[r.id]=(S.inv[r.id]||0)+1;save();sfx('coin');draw()},
  upRelic:d=>{const l=rlvl(d.id),c=upCost(d.id,l);if(!(S.inv[d.id]>0)||l>=MAXRL||S.gold<c)return;S.gold-=c;S.rl[d.id]=l+1;save();sfx('coin');draw()},
  t3d:()=>{S.no3d=!S.no3d;save();if(!S.no3d){R3.off=false;R3.ft=[];if(R3.state==='idle'||R3.state==='ready')r3Need(B?B.T[0].fs.concat(B.T[1].fs).map(f=>f.cid):Object.keys(R3.want))}if(B&&B.paused){B.paused=false;pause()}else draw()},
  mute:()=>{S.mute=!S.mute;save();audioKick();if(B&&B.paused){B.paused=false;pause()}else draw()},
  reset:()=>{if(!UI.resetArm){UI.resetArm=true;draw();return}try{localStorage.removeItem(KEY)}catch(e){}S=defSave();save();UI.resetArm=false;draw()},
  resume:()=>pause(),
  forfeit:()=>{const m=B.cfg.mode;leaveFight();go(m==='quick'?'prep':modeDest(m))},
  exit:()=>{const c=B.cfg,win=B.result==='win';leaveFight();if(c.mode==='story'&&win){const ch=STORY[c.stage-1];playScene('Chapter '+c.stage+': '+ch.t,ch.outro,ch.arena,()=>go('story'))}else go(modeDest(c.mode))},
  again:()=>{showFight(buildCfg())},
  nextStage:()=>{const c=B.cfg;UI.prep={mode:c.mode,stage:c.stage+1};leaveFight();go('prep')},
  toRoster:()=>{leaveFight();go('roster')},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;audioKick();const f=ACT[b.dataset.a];if(f)f(b.dataset)});
/* ================= boot ================= */
buildImages();draw();loadSprites();loadAnims();
/* warm up the 3D fighters in the menus so the first fight never stalls while Babylon loads */
setTimeout(()=>{const go=()=>{if(!B&&CHARS.some(c=>S.chars[c.id].own&&R3.want[c.id]))r3Need(Object.keys(R3.want))};if(window.requestIdleCallback)requestIdleCallback(go,{timeout:4000});else go()},1500);cloudInit();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{}).catch(()=>{});
window.__tf={spxRender:async(elem,kind,cost)=>{const old=AC;AC=new OfflineAudioContext(1,44100*2.4,44100);const prevMute=S.mute;S.mute=false;const tt={v:cost===3?1:.85,s:cost===3?1.15:1};try{const e=SPX.test[elem];if(kind==='beam')e.beam(tt,.9);else e[kind](tt)}catch(x){AC=old;S.mute=prevMute;throw x}const b=await AC.startRendering();AC=old;S.mute=prevMute;return Array.from(b.getChannelData(0))},card:(id,w,h)=>charCanvas(id,w,h,false).toDataURL(),pinDef,STORY,BOSSES,get B(){return B},get R3(){return R3},get S(){return S},CHARS,RELICS,tick,render,act:s=>act(s),useSpecial,startHeavy,breaker,tag,startAttack,showFight,buildCfg,UI,go,stageDef,ACT};
})();
</script>
